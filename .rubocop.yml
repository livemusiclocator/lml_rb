AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - "db/**/*"
Style/TrailingCommaInArguments:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInArrayLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInHashLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Max: 25
  AllowedMethods:
    # active admin methods that are kind of allowed to break the rule
    - "index"
    - "show"
    - "controller"
    - "register"
    - "register_page"
    - "content"
    - "panel"
    - "form"
    - "table_for"
    - "div"
  Exclude:
    - "config/routes.rb"
    - "config/initializers/active_admin.rb" # should we just exclude all the config?

plugins: rubocop-rspec

# The specs in here set instance variables in `before` blocks and never use `let` or `let!`, which
# is a deliberate house rule - see CLAUDE.md. This cop exists to push the other way, so it only
# ever fires on specs that are already doing the right thing.
RSpec/InstanceVariable:
  Enabled: false

# The other half of the same argument. These two enforce one-expectation-per-example, and the specs
# in here deliberately assert a whole outcome in one go - that a control said the right thing *and*
# left the right rows behind. Splitting those apart would mean driving the same form twice.
RSpec/MultipleExpectations:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false

# Same objection as `let` and `subject`: it hides what is being built. `Lml::Upload.create!` says
# what it makes on the line you are reading, where `described_class.create!` sends you to the top
# of the file to find out.
RSpec/DescribedClass:
  Enabled: false
